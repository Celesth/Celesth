<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celesth</title>
  <meta name="description" content="Yokoso" />

  <link rel="icon" href="/Assets/s_source/pfp.jpeg" type="image/jpeg" />

  <meta property="og:title" content="Celesth" />
  <meta property="og:description" content="Personal portfolio of celesth — developer, gamer, and creator." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/Assets/s_source/bg2.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Celesth" />
  <meta name="twitter:description" content="20+20+20+7=67" />
  <meta name="twitter:image" content="/Assets/s_source/bg2.png" />

  <link rel="preconnect" href="https://cdn.discordapp.com" />
  <link rel="preconnect" href="https://media.discordapp.net" />
  <link rel="preconnect" href="https://api.lanyard.rest" />
  <link rel="preconnect" href="https://api.github.com" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="glass top-header">
      <div class="header-left">
        <div class="avatar-ring">
          <img src="/Assets/s_source/pfp.jpeg" alt="avatar" class="avatar" />
        </div>
        <div class="user-info">
          <h1>celesth</h1>
          <span class="pronouns">he/him ✦ 愛</span>
        </div>
      </div>

      <div class="discord-presence">
        <div class="avatar-wrapper">
          <img id="discord-avatar" src="" alt="Discord Avatar" class="discord-avatar" />
          <div id="discord-status-dot" class="status-dot offline"></div>
        </div>
        <div class="presence-text">
          <h2 id="discord-username">Loading...</h2>
          <p id="discord-status">Status: Loading...</p>
        </div>
      </div>
    </header>

    <section class="glass">
      <h2 class="section-title"><span class="muted">✦</span> Projects</h2>
      <div class="tilt-grid" id="projects-grid"></div>
    </section>

    <section class="glass">
      <h2 class="section-title"><span class="muted">✦</span> Projects in Development</h2>
      <div class="carousel-wrap">
        <button class="carousel-btn carousel-prev" id="repo-prev">‹</button>
        <div class="carousel-track" id="repo-track"></div>
        <button class="carousel-btn carousel-next" id="repo-next">›</button>
      </div>
      <div class="carousel-dots" id="repo-dots"></div>
    </section>

    <section class="glass">
      <h2 class="section-title"><span class="muted">✦</span> Buns</h2>
      <p class="muted" style="margin-bottom:0.85rem">buns buns Buns</p>
      <div id="template-grid" class="tilt-grid"></div>
    </section>

    <section class="glass">
      <h2 class="section-title"><span class="muted">✦</span> Current Activities</h2>
      <div id="activities-container" class="activities"></div>
    </section>

    <section class="glass dob-card">
      <div class="dob-date">
        <h2>Dec <span>18th</span></h2>
      </div>
      <div class="dob-divider"></div>
      <div class="dob-info">
        <h3>Next Birthday</h3>
        <p id="dob-countdown">Loading...</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
